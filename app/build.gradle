plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

// Clave de TMDb (para "Dónde ver"), leída de local.properties para no
// comprometerla nunca en el repositorio. Agregá una línea así en tu
// local.properties (junto al sdk.dir que ya tenés):
//   TMDB_API_KEY=tu_clave_gratuita_de_themoviedb.org
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

android {
    namespace 'com.blackphantom.dondemierdaiba'
    compileSdk 34

    defaultConfig {
        applicationId "com.blackphantom.dondemierdaiba"
        // Android no tiene versión "4.5". La más compatible hacia abajo es
        // API 19 (Android 4.4 KitKat), por eso se usa como piso real.
        minSdk 19
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
        buildConfigField "String", "TMDB_API_KEY", "\"${localProps.getProperty('TMDB_API_KEY', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    // Con minSdk < 21 no alcanza con "un" dex: hace falta esta librería legacy
    // para que el instalador arme varios .dex y no choque contra el límite
    // de 65.536 métodos.
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Material 1.9.0 sigue soportando minSdk 19 y es compatible con compileSdk 34.
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.5.7'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.5.1'

    // Persistencia local
    // Persistencia local. 2.6.1 (no 2.4.3): la 2.4.3 tiene un bug conocido de
    // kapt con JDK 17 (el que trae Android Studio por defecto hace tiempo) que
    // genera "cannot override onCreate... weaker access privileges" en
    // AppDatabase_Impl. Sigue soportando minSdk 19 sin problema.
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Chequeo periódico en segundo plano (notificaciones de nuevos capítulos).
    // 2.8.1 (no 2.7.1) porque necesitamos ExistingPeriodicWorkPolicy.UPDATE,
    // que se agregó en la 2.8.0. Sigue soportando minSdk 19 sin problema.
    implementation 'androidx.work:work-runtime-ktx:2.8.1'

    // Carga de imágenes (galería / web), liviano
    implementation 'com.github.bumptech.glide:glide:4.13.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.10'
}
